<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Google tag (gtag.js). Hardcoded rather than read from VITE_GA_MEASUREMENT_ID:
      Vite inlines that variable at build time, so in any build where it was not
      set the ID became `undefined`, the loader below it became unreachable, and
      the bundler dropped the tag from the output entirely. A measurement ID is
      public in page source anyway, so there is nothing to protect by hiding it.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YHPYZQ885T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // /edit/ and /view/ carry the entire document in the URL, so those paths
      // must never reach GA. The automatic page_view is suppressed there; on
      // every other route it fires here, from static HTML, so a hit is recorded
      // without waiting for React to mount.
      var gaPath = location.pathname;
      var gaPrivate = gaPath.indexOf('/edit/') === 0 || gaPath.indexOf('/view/') === 0;

      // Keeps localhost and *.vercel.app previews out of the production property.
      if (/(^|\.)quill-bill\.com$/.test(location.hostname)) {
        gtag('config', 'G-YHPYZQ885T', {
          send_page_view: !gaPrivate,
          anonymize_ip: true
        });
      }
    </script>

    <title>QuillBill — Free Invoice & Quotation Generator</title>
    <meta name="description" content="Create professional invoices, quotations, and proposals for free. No sign-up, no watermarks, no backend — your data stays in your browser." />
    <meta name="keywords" content="invoice generator, quotation generator, proposal maker, free invoice, no login invoice, PDF invoice, shareable invoice" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="QuillBill" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://www.quill-bill.com/" />

    <!--
      These head tags are placeholders only. scripts/prerender.mjs strips them
      and writes each route's real title, description, canonical, Open Graph
      tags and JSON-LD into that route's own static HTML file at build time.
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QuillBill — Free Invoice & Quotation Generator" />
    <meta property="og:description" content="Create professional invoices, quotations, and proposals for free. No sign-up, no watermarks — your data stays in your browser." />
    <meta property="og:url" content="https://www.quill-bill.com/" />
    <meta property="og:site_name" content="QuillBill" />
    <meta property="og:image" content="https://www.quill-bill.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuillBill — Free Invoice & Quotation Generator" />
    <meta name="twitter:description" content="Create professional invoices, quotations, and proposals for free. No sign-up, no watermarks — your data stays in your browser." />
    <meta name="twitter:image" content="https://www.quill-bill.com/og-image.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="QxfXKDEe3DXHV9ed-u1oQiwX-KUXCED16CUVXwFz_XQ" />

    <!--
      No static JSON-LD here on purpose. Every route's structured data comes
      from src/seo/routeManifest.ts and is written into that route's prerendered
      file. A hardcoded block in the shell would be stamped onto all 40 pages,
      which previously put a WebApplication node (and the non-www host, which
      redirects) on articles that are not the application.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-blocking: as a print stylesheet the browser fetches it without
      blocking first paint, then the onload handler promotes it to all media.
      A render-blocking font request on a third-party host was delaying LCP.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>
    <!--
      The noscript fallback deliberately carries no <h1> and no page copy.
      Every route is prerendered, so the real content is already in this file
      before React boots. The old fallback duplicated the homepage's heading
      and body text into all 40 pages, giving each one two <h1> elements and a
      block of off-topic boilerplate.
    -->
    <noscript>
      <p>The document editor needs JavaScript. The guides and templates on this site read fine without it.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
